<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp — Details</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="InvApp" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Page-specific overrides */
    .controls-panel { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; align-items:end; padding:14px; }
    .chart-wrap { width:100%; height:300px; border-top:1px solid var(--border); position:relative; background:var(--surface); border-radius:0 0 var(--radius-lg) var(--radius-lg); }
    #tooltip { position:absolute; background:var(--fg); color:var(--surface); padding:6px 10px; border-radius:var(--radius-sm); font-size:.82rem; pointer-events:none; display:none; box-shadow:var(--shadow); }
    .data-section { margin-top:12px; padding:14px; }
    .data-section-title { font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--fg-muted); margin:0 0 10px; }
    .vendor-grid-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
    .order-grid-2  { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
    .order-field   { display:flex; flex-direction:column; gap:4px; }
    .order-field label { font-size:.72rem; font-weight:700; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.05em; }
    .events-list { max-height:300px; overflow:auto; font-size:.85rem; color:var(--fg-muted); line-height:1.7; }
    .nav-item-nav { display:flex; gap:6px; }
    [data-theme="dark"] #saveReorder { background:var(--info); }
    #saveReorder { background:var(--info); color:#fff; }
  </style>
  <script>
    try {
      const t = localStorage.getItem('invapp.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
  <script src="/idb.js"></script>
  <script src="/catalog.js"></script>
  <script src="/history.js"></script>
</head>
<body>

  <nav class="app-nav">
    <a class="app-nav__brand" href="/"><span class="app-nav__dot"></span>InvApp</a>
    <div class="app-nav__links">
      <a href="/"            class="app-nav__link">Inventory</a>
      <a href="/bars.html"   class="app-nav__link">Stock</a>
      <a href="/history.html"class="app-nav__link is-active">Details</a>
      <a href="/orders.html" class="app-nav__link">Orders</a>
      <a href="/vendors.html"class="app-nav__link">Vendors</a>
    </div>
    <div class="app-nav__actions">
      <div class="nav-item-nav">
        <button id="prevItemBtn" class="btn-nav" type="button">&#8592; Prev</button>
        <button id="nextItemBtn" class="btn-nav" type="button">Next &#8594;</button>
      </div>
      <button id="themeToggle" class="btn-nav">Dark</button>
    </div>
  </nav>

  <div class="page">
    <!-- Item controls panel -->
    <div class="panel" style="margin-bottom:12px">
      <div class="controls-panel">
        <div class="field"><label for="item">Item</label><select id="item"></select></div>
        <div class="field"><label for="reorderInput">Reorder Level</label><input id="reorderInput" type="number" placeholder="Enter level" /></div>
        <div class="field"><label for="salePriceInput">Sale Price</label><input id="salePriceInput" type="number" step="0.01" placeholder="0.00" /></div>
        <div class="field"><label for="from">From Date</label><input type="date" id="from" /></div>
        <div class="field"><label for="to">To Date</label><input type="date" id="to" /></div>
        <div style="display:flex;align-items:flex-end">
          <button id="saveReorder" class="btn" style="height:34px">Save Item</button>
        </div>
      </div>
      <div id="chartWrap" class="chart-wrap">
        <canvas id="chartCanvas"></canvas>
        <div id="tooltip"></div>
      </div>
    </div>

    <!-- Vendor order info -->
    <div class="panel data-section" style="margin-bottom:12px">
      <p class="data-section-title">Order Details</p>
      <div class="order-grid-2">
        <div class="order-field"><label for="orderedFrom">Ordered From</label><select id="orderedFrom"></select></div>
        <div class="order-field"><label for="vendorContact">Vendor Contact</label><input id="vendorContact" type="text" readonly /></div>
        <div class="order-field"><label for="vendorEmails">Vendor Email</label><input id="vendorEmails" type="text" readonly /></div>
        <div class="order-field"><label for="vendorPhone">Vendor Phone</label><input id="vendorPhone" type="text" readonly /></div>
      </div>
    </div>

    <!-- Vendor options -->
    <div class="panel data-section" style="margin-bottom:12px">
      <p class="data-section-title">Vendor Options</p>
      <div id="vendors" class="vendor-grid-2">
        <div class="vendorEmpty">No vendor options found for this item.</div>
      </div>
    </div>

    <!-- Events log -->
    <div class="panel data-section">
      <p class="data-section-title">Event Log</p>
      <div id="events" class="events-list"></div>
    </div>
  </div>

</body>
</html>
