<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - History</title>
  <style>
    :root{--bg:#ffffff;--fg:#111}
    body{font-family:system-ui,Arial;padding:12px;background:var(--bg);color:var(--fg)}
    .controls{display:flex;gap:8px;align-items:center}
    #chartWrap{width:100%;height:260px;border:1px solid #ddd;position:relative}
    canvas{width:100%;height:100%;display:block}
    #tooltip{position:absolute;background:#111;color:#fff;padding:6px;border-radius:6px;font-size:0.85rem;pointer-events:none;display:none}
    .events{margin-top:12px}
    body[data-theme="dark"]{ --bg:#050505; --fg:#eee }
    body[data-theme="dark"] #chartWrap{border-color:#333}
    body[data-theme="dark"] #tooltip{background:#fff;color:#000}
    #themeToggle{padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#111}
    body[data-theme="dark"] #themeToggle{background:#222;color:#fff;border-color:#444}
  </style>
  <script src="/idb.js"></script>
  <script src="/history.js"></script>
</head>
<body>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('invapp.theme');
        if (t === 'dark' || t === 'light') document.body.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <h1>History</h1>
  <div class="controls">
    <select id="item"></select>
    <input id="reorderInput" placeholder="Reorder level" style="width:110px;padding:6px;border-radius:6px;border:1px solid #ccc" />
    <button id="saveReorder" style="padding:6px 10px;border-radius:6px;background:#1976d2;color:#fff;border:0">Save</button>
    <input type="date" id="from" />
    <input type="date" id="to" />
    <a href="/">Back</a>
    <button id="themeToggle">Dark</button>
  </div>
  <div id="chartWrap"><canvas id="chartCanvas"></canvas><div id="tooltip"></div></div>
  <div id="events" class="events"></div>
</body>
</html>
