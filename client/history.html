<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - Details</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    :root{
      --bg:#f4f6f8;
      --fg:#0f172a;
      --panel:#ffffff;
      --border:#d8dee4;
      --muted:#64748b;
      --accent-2:#0b5ed7;
      --secondary:#e5e7eb;
      --link:#111;
    }
    body[data-theme="dark"]{
      --bg:#050505;
      --fg:#eee;
      --panel:#0f1115;
      --border:#2b2f36;
      --muted:#9aa4b2;
      --accent-2:#2563eb;
      --secondary:#1b1f25;
      --link:#e5e7eb;
    }
    body{font-family:system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif;padding:16px;background:var(--bg);color:var(--fg);margin:0}
    h1{margin:0;font-size:1.5rem}
    .subtitle{margin:4px 0 0 0;color:var(--muted);font-size:0.95rem}
    .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;margin-bottom:12px}
    .topCenter{display:flex;justify-content:center;gap:8px;align-items:center}
    .topRight{display:flex;justify-content:flex-end}
    @media (max-width: 860px){
      .topbar{grid-template-columns:1fr}
      .topCenter,.topRight{justify-content:flex-start}
    }
    .topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btnSecondary{background:var(--secondary);color:var(--link)}
    .btnNeutral{background:var(--panel);color:var(--link);border-color:var(--border)}
    #saveReorder{background:var(--accent-2);color:#fff}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:0.85rem;font-weight:700;color:#334155}
    .field select,.field input{height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:#fff;color:#111}
    .field input[type="date"]{padding-right:6px}
    .actions{display:flex;gap:8px;align-items:end}
    #chartWrap{width:100%;height:300px;border:1px solid var(--border);position:relative;border-radius:12px;margin-top:12px;background:var(--panel)}
    canvas{width:100%;height:100%;display:block}
    #tooltip{position:absolute;background:#111;color:#fff;padding:6px;border-radius:6px;font-size:0.85rem;pointer-events:none;display:none}
    .events{margin-top:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;max-height:320px;overflow:auto}
    .vendorPanel{margin-top:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
    .vendorList{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
    .vendorCard{border:1px solid var(--border);border-radius:10px;padding:10px;background:rgba(15,23,42,0.02)}
    .vendorCard h3{margin:0 0 6px 0;font-size:1rem}
    .vendorGrid{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:0.9rem}
    .vendorGrid dt{font-weight:700;color:#334155}
    .vendorGrid dd{margin:0;word-break:break-word}
    .vendorGrid label{font-weight:700;color:#334155}
    .vendorGrid input{height:30px;border:1px solid #cbd5e1;border-radius:6px;padding:0 8px;background:#fff;color:#111}
    .vendorEmpty{color:var(--muted)}
    .eventsTitle{font-size:0.95rem;font-weight:700;margin:4px 0 8px 0;color:#334155}
    body[data-theme="dark"] .field label{color:#cbd5e1}
    body[data-theme="dark"] .field select,
    body[data-theme="dark"] .field input{background:#0b0d10;color:#e5e7eb;border-color:#3a3f46}
    body[data-theme="dark"] .vendorGrid label{color:#cbd5e1}
    body[data-theme="dark"] .vendorGrid input{background:#0b0d10;color:#e5e7eb;border-color:#3a3f46}
    body[data-theme="dark"] #tooltip{background:#fff;color:#000}
  </style>
  <script src="/idb.js"></script>
  <script src="/catalog.js"></script>
  <script src="/history.js"></script>
</head>
<body>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('invapp.theme');
        if (t === 'dark' || t === 'light') document.body.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>

  <div class="topbar">
    <div>
      <h1>Details</h1>
      <p class="subtitle">Item timeline and count details</p>
    </div>
    <div class="topCenter">
      <button id="prevItemBtn" class="btn btnSecondary" type="button">Previous</button>
      <button id="nextItemBtn" class="btn btnSecondary" type="button">Next</button>
    </div>
    <div class="topRight">
      <div class="topActions">
        <a href="/" class="btn btnSecondary">Home</a>
        <a href="/vendors.html" class="btn btnSecondary">Vendors</a>
        <button id="themeToggle" class="btn btnNeutral">Dark</button>
      </div>
    </div>
  </div>

  <div class="panel controls">
    <div class="field">
      <label for="item">Item</label>
      <select id="item"></select>
    </div>
    <div class="field">
      <label for="reorderInput">Reorder level</label>
      <input id="reorderInput" type="number" placeholder="Enter level" />
    </div>
    <div class="actions">
      <button id="saveReorder" class="btn">Save reorder</button>
    </div>
    <div class="field">
      <label for="from">From date</label>
      <input type="date" id="from" />
    </div>
    <div class="field">
      <label for="to">To date</label>
      <input type="date" id="to" />
    </div>
  </div>

  <div id="chartWrap"><canvas id="chartCanvas"></canvas><div id="tooltip"></div></div>
  <div class="vendorPanel">
    <div id="vendors" class="vendorList">
      <div class="vendorEmpty">No vendor options found for this item.</div>
    </div>
  </div>

  <div class="events">
    <div class="eventsTitle">Events</div>
    <div id="events"></div>
  </div>
</body>
</html>
