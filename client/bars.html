<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp — Stock</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try {
      const t = localStorage.getItem('invapp.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
</head>
<body>

  <nav class="app-nav">
    <a class="app-nav__brand" href="/"><span class="app-nav__dot"></span>InvApp</a>
    <div class="app-nav__links">
      <a href="/"            class="app-nav__link">Inventory</a>
      <a href="/bars.html"   class="app-nav__link is-active">Stock</a>
      <a href="/history.html"class="app-nav__link">Details</a>
      <a href="/orders.html" class="app-nav__link">Orders</a>
      <a href="/vendors.html"class="app-nav__link">Vendors</a>
    </div>
    <div class="app-nav__actions">
      <button id="themeToggle" class="btn-nav">Dark</button>
    </div>
  </nav>

  <div class="page">
    <div style="margin-bottom:14px">
      <h1 style="margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.02em">Stock Levels</h1>
      <p style="margin:2px 0 0;font-size:.84rem;color:var(--fg-muted)">Current quantities by category</p>
    </div>
    <div id="charts"></div>
  </div>

  <script src="/idb.js"></script>
  <script src="/catalog.js"></script>
  <script src="/bars.js"></script>
</body>
</html>
