<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - Bars</title>
  <style>
    :root{--bg:#ffffff;--fg:#111;--panel:#fff;--border:#ddd}
    body{font-family:system-ui,Arial;padding:12px;background:var(--bg);color:var(--fg)}
    .categoryChart{border:1px solid var(--border);border-radius:10px;margin-top:10px;background:var(--panel)}
    .categoryChart summary{padding:10px 12px;cursor:pointer;font-weight:700}
    .categoryChart summary::-webkit-details-marker{display:none}
    .categoryChart summary::before{content:'▾ ';font-size:0.9rem}
    .categoryChart:not([open]) summary::before{content:'▸ '}
    .chartWrap{width:100%;height:320px;border-top:1px solid var(--border);position:relative}
    canvas{width:100%;height:100%;display:block}
    .tooltip{position:absolute;background:#111;color:#fff;padding:6px;border-radius:6px;font-size:0.85rem;pointer-events:none;display:none}
    body[data-theme="dark"]{ --bg:#050505; --fg:#eee; --panel:#0f1115; --border:#333 }
    #themeToggle{margin-left:8px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;color:#111}
    body[data-theme="dark"] #themeToggle{background:#222;color:#fff;border-color:#444}
  </style>
</head>
<body>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('invapp.theme');
        if (t === 'dark' || t === 'light') document.body.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <h1>Inventory Bars</h1>
  <p><a href="/">Back</a><button id="themeToggle">Dark</button></p>
  <div id="charts"></div>
  <script src="/idb.js"></script>
  <script src="/bars.js"></script>
</body>
</html>
