<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - Bars</title>
  <style>
    :root{--bg:#ffffff;--fg:#111}
    body{font-family:system-ui,Arial;padding:12px;background:var(--bg);color:var(--fg)}
    #chartWrap{width:100%;height:420px;border:1px solid #ddd;position:relative}
    canvas{width:100%;height:100%;display:block}
    #tooltip{position:absolute;background:#111;color:#fff;padding:6px;border-radius:6px;font-size:0.85rem;pointer-events:none;display:none}
    body[data-theme="dark"]{ --bg:#050505; --fg:#eee }
    #themeToggle{margin-left:8px;padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#111}
    body[data-theme="dark"] #chartWrap{border-color:#333}
    body[data-theme="dark"] #themeToggle{background:#222;color:#fff;border-color:#444}
  </style>
</head>
<body>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('invapp.theme');
        if (t === 'dark' || t === 'light') document.body.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <h1>Inventory Bars</h1>
  <p><a href="/">Back</a><button id="themeToggle">Dark</button></p>
  <div id="chartWrap"><canvas id="barsCanvas"></canvas><div id="tooltip"></div></div>
  <script src="/idb.js"></script>
  <script src="/bars.js"></script>
</body>
</html>
