<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - Bars</title>
  <style>
    body{font-family:system-ui,Arial;padding:12px;background:var(--bg);color:var(--fg)}
    #chartWrap{width:100%;height:420px;border:1px solid #ddd;position:relative}
    canvas{width:100%;height:100%;display:block}
    #tooltip{position:absolute;background:#111;color:#fff;padding:6px;border-radius:6px;font-size:0.85rem;pointer-events:none;display:none}
    body[data-theme="dark"]{ --bg:#050505; --fg:#eee }
  </style>
</head>
<body>
  <h1>Inventory Bars</h1>
  <p><a href="/">Back</a></p>
  <div id="chartWrap"><canvas id="barsCanvas"></canvas><div id="tooltip"></div></div>
  <script src="/bars.js"></script>
</body>
</html>
