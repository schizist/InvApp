<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp — Orders</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* ---- Orders page layout ---- */
    .orders-layout {
      display: grid;
      grid-template-columns: minmax(270px, 340px) 1fr;
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 860px) { .orders-layout { grid-template-columns: 1fr; } }

    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

    /* Sidebar action row */
    .sidebar-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sidebar-actions .btn { height: 32px; font-size: .8rem; padding: 0 10px; }

    /* Editor */
    .statusLine { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .formGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; }
    .sectionTitle { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 8px; }
    .sectionTitle h2 { font-size: .95rem; font-weight: 800; margin: 0; }
    .sectionTitle .topActions { display: flex; gap: 6px; }

    .lineCard {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-bottom: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    [data-theme="dark"] .lineCard { background: var(--surface-2); }
    .lineGrid {
      display: grid;
      grid-template-columns: 1.1fr 1.6fr .6fr .5fr .8fr .8fr .7fr .8fr;
      gap: 8px;
      align-items: end;
    }
    @media (max-width: 1100px) { .lineGrid { grid-template-columns: repeat(2, 1fr); } }
    .lineGrid label { font-size: .7rem; font-weight: 800; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; }

    .receiveBox {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      align-items: end;
    }
    .receipts { font-size: .82rem; color: var(--fg-muted); margin-top: 8px; line-height: 1.6; }

    .editor-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

    .empty { color: var(--fg-muted); padding: 24px; text-align: center; font-size: .9rem; }
  </style>
  <script>
    try {
      const t = localStorage.getItem('invapp.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
</head>
<body>

  <nav class="app-nav">
    <a class="app-nav__brand" href="/"><span class="app-nav__dot"></span>InvApp</a>
    <div class="app-nav__links">
      <a href="/"            class="app-nav__link">Inventory</a>
      <a href="/bars.html"   class="app-nav__link">Stock</a>
      <a href="/history.html"class="app-nav__link">Details</a>
      <a href="/orders.html" class="app-nav__link is-active">Orders</a>
      <a href="/vendors.html"class="app-nav__link">Vendors</a>
    </div>
    <div class="app-nav__actions">
      <button id="syncOrdersBtn" class="btn-nav primary">Sync Orders</button>
      <button id="themeToggle"   class="btn-nav">Dark</button>
    </div>
  </nav>

  <div class="page">
    <div class="orders-layout">

      <!-- Sidebar: list + filters -->
      <aside class="panel" style="padding:12px">
        <div class="filters">
          <input id="searchInput" placeholder="Search PO, vendor, client…" />
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="open">Open orders</option>
            <option value="needs">Needs receiving</option>
            <option value="draft">Draft</option>
            <option value="ordered">Ordered</option>
            <option value="partially_received">Partially received</option>
            <option value="received">Received</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="sidebar-actions">
          <button id="newOrderBtn"  class="btn btnPrimary">+ New Order</button>
          <button id="duplicateBtn" class="btn btnNeutral">Duplicate</button>
          <button id="sheetBtn"     class="btn btnNeutral">Order Sheet</button>
        </div>
        <div id="ordersList" class="orderList"></div>
      </aside>

      <!-- Main: editor -->
      <main class="panel" style="padding:14px">
        <div id="editorEmpty" class="empty">Create or select an order to get started.</div>
        <div id="editor" style="display:none">
          <div class="statusLine">
            <strong id="poLabel" style="font-size:1.05rem"></strong>
            <span id="statusBadge" class="badge draft">draft</span>
            <span id="progressLabel" style="font-size:.82rem;color:var(--fg-muted)"></span>
          </div>

          <div class="formGrid">
            <div class="field"><label>PO Number</label><input id="poNumber" placeholder="Auto-generated if blank" /></div>
            <div class="field"><label>Client / Contractor</label><input id="clientName" /></div>
            <div class="field"><label>Job Name</label><input id="jobName" /></div>
            <div class="field"><label>Order Date</label><input id="orderDate" type="date" /></div>
            <div class="field"><label>Ordered From</label><select id="vendorName" required></select></div>
            <div class="field"><label>Vendor Contact</label><input id="vendorContactName" readonly /></div>
            <div class="field"><label>Vendor Email</label><input id="vendorEmail" readonly /></div>
            <div class="field"><label>Vendor Phone</label><input id="vendorPhone" readonly /></div>
            <div class="field"><label>Ordered By</label><input id="orderedBy" /></div>
            <div class="field"><label>Entered By</label><input id="enteredBy" /></div>
            <div class="field"><label>Status</label>
              <select id="status">
                <option>draft</option><option>ordered</option>
                <option>partially_received</option><option>received</option><option>cancelled</option>
              </select>
            </div>
            <div class="field"><label>Notes</label><textarea id="notes"></textarea></div>
          </div>

          <div class="sectionTitle">
            <h2>Line Items</h2>
            <div class="topActions">
              <select id="lineStatusFilter" class="btn btnNeutral" style="height:32px;font-size:.8rem" aria-label="Filter line status">
                <option value="">All lines</option>
                <option value="pending">Pending</option>
                <option value="partially_received">Partial</option>
                <option value="complete">Complete</option>
                <option value="cancelled">Cancelled</option>
              </select>
              <button id="addLineBtn" class="btn btnNeutral" style="height:32px;font-size:.8rem">+ Add Line</button>
            </div>
          </div>

          <datalist id="itemOptions"></datalist>
          <div id="lines"></div>

          <div class="editor-actions">
            <button id="saveDraftBtn"   class="btn btnNeutral">Save Draft</button>
            <button id="markOrderedBtn" class="btn btnPrimary">Mark Ordered</button>
            <button id="cancelOrderBtn" class="btn btnDanger">Cancel Order</button>
            <button id="deleteOrderBtn" class="btn btnDanger">Delete Order</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- New inventory item modal -->
  <div id="newItemModal" class="newItemOverlay" role="dialog" aria-modal="true" aria-labelledby="newItemTitle">
    <div class="newItemBox">
      <h3 id="newItemTitle">New Inventory Item</h3>
      <div class="field"><label>Label <span class="optional">(required)</span></label><input id="newItemLabel" placeholder="e.g. M-175-30" autocomplete="off" /></div>
      <div class="field"><label>Category</label>
        <select id="newItemCategory">
          <option value="mold">Mold</option><option value="wire">Wire</option>
          <option value="shot">Shot</option><option value="cap">Cap</option>
          <option value="enclosure">Enclosure</option><option value="anode">Anode</option>
          <option value="refcell">Ref Cell</option><option value="other">Other</option>
        </select>
      </div>
      <div class="field"><label>Unit <span class="optional">(optional)</span></label><input id="newItemUnit" placeholder="pcs" /></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="newItemCancelBtn" class="btn btnNeutral">Cancel</button>
        <button id="newItemSaveBtn"   class="btn btnPrimary">Create &amp; Select</button>
      </div>
    </div>
  </div>

  <script src="/idb.js"></script>
  <script src="/catalog.js"></script>
  <script src="/orders.js"></script>
</body>
</html>
