<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - Vendors</title>
  <style>
    :root{--bg:#f4f6f8;--fg:#0f172a;--panel:#ffffff;--border:#d8dee4;--muted:#64748b;--secondary:#e5e7eb;--link:#111;--accent:#0b5ed7;--danger:#c62828}
    body[data-theme="dark"]{--bg:#050505;--fg:#eee;--panel:#0f1115;--border:#2b2f36;--muted:#9aa4b2;--secondary:#1b1f25;--link:#e5e7eb;--accent:#2563eb}
    body{font-family:system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif;padding:16px;margin:0;background:var(--bg);color:var(--fg)}
    h1{margin:0;font-size:1.5rem}
    .subtitle{margin:4px 0 0 0;color:var(--muted);font-size:0.95rem}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btnSecondary{background:var(--secondary);color:var(--link)}
    .btnNeutral{background:var(--panel);color:var(--link);border-color:var(--border)}
    .btnPrimary{background:var(--accent);color:#fff}
    .btnDanger{background:var(--danger);color:#fff}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
    .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:0.85rem;font-weight:700;color:#334155}
    .field input{height:36px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:#fff;color:#111}
    .vendorList{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
    .vendorCard{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--panel)}
    .vendorCard h3{margin:0;font-size:1rem}
    .muted{color:var(--muted)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .actions{display:flex;gap:6px}
    .empty{color:var(--muted)}
    body[data-theme="dark"] .field label{color:#cbd5e1}
    body[data-theme="dark"] .field input{background:#0b0d10;color:#e5e7eb;border-color:#3a3f46}
  </style>
</head>
<body>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('invapp.theme');
        if (t === 'dark' || t === 'light') document.body.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <div class="topbar">
    <div>
      <h1>Vendors</h1>
      <p class="subtitle">Manage your vendor list</p>
    </div>
    <div class="topActions">
      <a href="/" class="btn btnSecondary">Home</a>
      <a href="/history.html" class="btn btnSecondary">Details</a>
      <button id="themeToggle" class="btn btnNeutral">Dark</button>
    </div>
  </div>

  <section class="panel">
    <div class="fields">
      <div class="field">
        <label for="newCompany">Company</label>
        <input id="newCompany" />
      </div>
      <div class="field">
        <label for="newContactName">Contact Name</label>
        <input id="newContactName" />
      </div>
      <div class="field">
        <label for="newContactEmail">Contact Email</label>
        <input id="newContactEmail" />
      </div>
      <div class="field">
        <label for="newOnTimeScore">On-Time Score (%)</label>
        <input id="newOnTimeScore" type="number" step="0.01" />
      </div>
    </div>
    <div style="margin-top:10px">
      <button id="addVendorBtn" class="btn btnPrimary">Add Vendor</button>
    </div>
  </section>

  <section class="vendorList" id="vendorList"></section>
  <script src="/vendors.js"></script>
</body>
</html>
