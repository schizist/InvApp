<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp — Vendors</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="InvApp" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .vendor-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; margin-top:14px; }
  </style>
  <script>
    try {
      const t = localStorage.getItem('invapp.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
</head>
<body>

  <nav class="app-nav">
    <a class="app-nav__brand" href="/"><span class="app-nav__dot"></span>InvApp</a>
    <div class="app-nav__links">
      <a href="/"            class="app-nav__link">Inventory</a>
      <a href="/bars.html"   class="app-nav__link">Stock</a>
      <a href="/history.html"class="app-nav__link">Details</a>
      <a href="/orders.html" class="app-nav__link">Orders</a>
      <a href="/vendors.html"class="app-nav__link is-active">Vendors</a>
    </div>
    <div class="app-nav__actions">
      <button id="themeToggle" class="btn-nav">Dark</button>
    </div>
  </nav>

  <div class="page">
    <div style="margin-bottom:14px">
      <h1 style="margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.02em">Vendors</h1>
      <p style="margin:2px 0 0;font-size:.84rem;color:var(--fg-muted)">Manage your vendor list</p>
    </div>

    <section class="panel" style="padding:14px">
      <p class="section-title" style="margin-bottom:12px">Add Vendor</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
        <div class="field"><label for="newCompany">Company</label><input id="newCompany" /></div>
        <div class="field"><label for="newContactName">Contact Name</label><input id="newContactName" /></div>
        <div class="field"><label for="newContactEmail">Contact Email</label><input id="newContactEmail" /></div>
        <div class="field"><label for="newContactPhone">Contact Phone</label><input id="newContactPhone" /></div>
        <div class="field"><label for="newOnTimeScore">On-Time Score (%)</label><input id="newOnTimeScore" type="number" step="0.01" /></div>
      </div>
      <div style="margin-top:12px">
        <button id="addVendorBtn" class="btn btnPrimary">Add Vendor</button>
      </div>
    </section>

    <div id="vendorList" class="vendor-grid"></div>
  </div>

  <script src="/vendors.js"></script>
</body>
</html>
