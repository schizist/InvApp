<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - Inventory PWA</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root{--bg:#ffffff;--fg:#0b0b0b;--accent:#1b5e20;--high-contrast-bg:#000;--high-contrast-fg:#fff}
    body[data-theme="dark"]{ --bg:#050505; --fg:#eee; --accent:#66bb6a; --high-contrast-bg:#fff; --high-contrast-fg:#000 }
    /* mirror prefers-color-scheme:dark overrides so the toggle affects hard-coded styles */
    body[data-theme="dark"] .item{background:#0b0b0b;border-color:#222}
    body[data-theme="dark"] .meta{color:#ccc}
    body[data-theme="dark"] .controls button.btnPlus{background:#66bb6a}
    body[data-theme="dark"] .controls button.btnMinus{background:#ef5350}
    body[data-theme="dark"] .meta .delta{color:rgba(255,255,255,0.5)}
    html,body{height:100%;}
    body{font-family:system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif;margin:0;padding:12px;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
    h1{margin:0 0 8px 0;font-size:1.25rem}
    .item{display:flex;justify-content:space-between;align-items:center;padding:.6rem;border-bottom:1px solid #ddd;border-radius:6px;margin-bottom:8px;background:#fff}
    .left{display:flex;flex-direction:column}
    .label{font-size:1.1rem;font-weight:600}
    .labelLink{
      display:inline-block;
      text-decoration:none;
      color:#111;
      background:#f1f3f4;
      border:1px solid #d0d7de;
      border-radius:8px;
      padding:4px 10px;
      line-height:1.2;
    }
    .labelLink:hover{background:#e8eaed}
    .labelLink:active{transform:translateY(1px)}
    .meta{margin-top:6px;font-size:0.95rem;color:#222;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .meta .qty{font-weight:800;color:var(--high-contrast-fg);background:var(--high-contrast-bg);padding:4px 8px;border-radius:6px}
    .meta .delta{color:rgba(0,0,0,0.5)}
    .meta .display{color:#444;margin-left:6px}
    .controls{display:flex;flex-direction:column;align-items:center;gap:8px}
    .controls button{width:64px;height:64px;border-radius:10px;border:0;color:#fff;font-size:1.25rem;box-shadow:0 2px 0 rgba(0,0,0,0.2);touch-action:manipulation}
    .controls button.btnPlus{background:#2e7d32}
    .controls button.btnMinus{background:#c62828}
    .controls button.btnSet{background:#1976d2;width:32px;height:32px;border-radius:8px;font-size:0.65rem}
    .controls button:active{transform:translateY(1px)}
    #items{margin-top:12px}
    #queued{background:#fff8e1;border:1px solid #ffe082;padding:.5rem;margin-top:1rem;border-radius:6px}
    #syncBtn{background:#2e7d32;color:#fff;padding:8px 12px;border-radius:8px;border:0;font-weight:600;margin-right:8px}
    #syncBtn.loading{position:relative}
    #syncBtn.loading::after{content:"";width:16px;height:16px;border:2px solid rgba(255,255,255,0.6);border-top-color:transparent;border-radius:50%;position:absolute;right:10px;top:50%;transform:translateY(-50%);animation:spin 1s linear infinite}

    @keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

    @media (prefers-color-scheme:dark){body:not([data-theme]){--bg:#050505;--fg:#eee;--high-contrast-bg:#fff;--high-contrast-fg:#000} body:not([data-theme]) .item{background:#0b0b0b;border-color:#222} body:not([data-theme]) .meta{color:#ccc} body:not([data-theme]) .controls button.btnPlus{background:#66bb6a} body:not([data-theme]) .controls button.btnMinus{background:#ef5350} body:not([data-theme]) .meta .delta{color:rgba(255,255,255,0.5)}}

    /* Header buttons uniform styling */
    #syncBtn, #themeToggle, #endSessionBtn, #barsLink, #historyLink {
      display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 12px; border-radius:8px; text-decoration:none; font-weight:600; margin-left:8px; cursor:pointer; vertical-align:middle;
    }
    #syncBtn{ background:#2e7d32; color:#fff; border:0 }
    #themeToggle{ background:#fff; color:#111; border:1px solid #ddd }
    #barsLink, #historyLink{ background:#eee; color:#111; border:0 }
    body[data-theme="dark"] #themeToggle{ background:#222; color:#fff; border:1px solid #444 }
    body[data-theme="dark"] .labelLink{ color:#eee; background:#1b1d20; border-color:#3a3f45 }
    body[data-theme="dark"] .labelLink:hover{ background:#24282d }
  </style>
</head>
<body>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('invapp.theme');
        if (t === 'dark' || t === 'light') document.body.setAttribute('data-theme', t);
        window.addEventListener('DOMContentLoaded', ()=>{ const btn = document.getElementById('themeToggle'); if (btn) btn.textContent = (t==='dark') ? 'Light' : 'Dark'; });
      }catch(e){}
    })();
  </script>
  <h1>InvApp</h1>
  <div>
    <button id="syncBtn">Sync Now</button>
    <a id="barsLink" href="/bars.html">Stock</a>
    <a id="historyLink" href="/history.html">History</a>
    <button id="themeToggle">Dark</button>
    <button id="endSessionBtn" style="display:none">End Session</button>
    <span id="sessionInfo" style="margin-left:8px;color:#666"></span>
    <span id="status">Status: unknown</span>
  </div>

  <h2>Items</h2>
  <div id="items"></div>

  <h3>Queued Events (offline)</h3>
  <div id="queued"></div>

  <template id="itemTpl">
    <div class="item">
      <div>
        <div class="label"><a class="labelText labelLink" href="#"></a> <span class="reorderBadge" style="display:none;margin-left:8px;background:#c62828;color:#fff;padding:2px 6px;border-radius:4px;font-size:0.8rem">REORDER</span></div>
        <div class="meta"></div>
      </div>
      <div class="controls">
        <button class="btnPlus">+</button>
        <button class="btnMinus">-</button>
        <button class="btnSet">Set</button>
      </div>
    </div>
  </template>

  <script src="/idb.js"></script>
  <script src="/app.js"></script>
</body>
</html>
