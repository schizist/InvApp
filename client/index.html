<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp — Inventory</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="InvApp" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try {
      const t = localStorage.getItem('invapp.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
</head>
<body>

  <nav class="app-nav">
    <a class="app-nav__brand" href="/"><span class="app-nav__dot"></span>InvApp</a>
    <div class="app-nav__links">
      <a href="/"            class="app-nav__link is-active">Inventory</a>
      <a href="/bars.html"   class="app-nav__link" id="barsLink">Stock</a>
      <a href="/history.html"class="app-nav__link" id="historyLink">Details</a>
      <a href="/orders.html" class="app-nav__link">Orders</a>
      <a href="/vendors.html"class="app-nav__link">Vendors</a>
    </div>
    <div class="app-nav__actions">
      <select id="dbSelect" class="dbSelect" aria-label="Select database"></select>
      <button id="createDbBtn" class="btn-nav" type="button">New DB</button>
      <button id="syncBtn"     class="btn-nav primary">Sync</button>
      <span   id="statusPill"  class="status-pill offline">Offline</span>
      <button id="themeToggle" class="btn-nav">Dark</button>
      <button id="endSessionBtn" class="btn-nav" style="display:none">End Session</button>
    </div>
  </nav>

  <!-- hidden — app.js reads/sets this but we show the pill instead -->
  <span id="status" style="display:none"></span>
  <span id="sessionInfo" style="display:none"></span>

  <div class="page">
    <div id="items"></div>

    <p id="queueSummary">Queued: <strong><span id="queuedCount">0</span></strong></p>
    <div id="queued">No queued events</div>
  </div>

  <template id="itemTpl">
    <div class="item">
      <div style="min-width:0;flex:1">
        <div class="label">
          <a class="labelText labelLink" href="#"></a>
          <span class="reorderBadge" style="display:none">REORDER</span>
        </div>
        <div class="meta"></div>
      </div>
      <div class="controls">
        <button class="btnPlus" type="button">+</button>
        <button class="btnMinus" type="button">−</button>
        <button class="btnSet"   type="button">Set</button>
      </div>
    </div>
  </template>

  <script src="/idb.js"></script>
  <script src="/catalog.js"></script>
  <script src="/app.js"></script>
</body>
</html>
