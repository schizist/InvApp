<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp - Inventory PWA</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root{--bg:#ffffff;--fg:#0b0b0b;--accent:#1b5e20;--high-contrast-bg:#000;--high-contrast-fg:#fff}
    html,body{height:100%;}
    body{font-family:system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif;margin:0;padding:12px;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
    h1{margin:0 0 8px 0;font-size:1.25rem}
    .item{display:flex;justify-content:space-between;align-items:center;padding:.6rem;border-bottom:1px solid #ddd;border-radius:6px;margin-bottom:8px;background:#fff}
    .left{display:flex;flex-direction:column}
    .label{font-size:1.1rem;font-weight:600}
    .meta{margin-top:6px;font-size:0.95rem;color:#222;display:flex;align-items:center;gap:8px}
    .meta .qty{font-weight:800;color:var(--high-contrast-fg);background:var(--high-contrast-bg);padding:4px 8px;border-radius:6px;margin-right:8px}
    .meta .delta{color:rgba(0,0,0,0.5);min-width:48px;text-align:center}
    .meta .display{color:#444;margin-left:6px}
    .controls{display:flex;flex-direction:column;align-items:center;gap:8px}
    .controls button{width:64px;height:64px;border-radius:10px;border:0;color:#fff;font-size:1.25rem;box-shadow:0 2px 0 rgba(0,0,0,0.2);touch-action:manipulation}
    .controls button.btnPlus{background:#2e7d32}
    .controls button.btnMinus{background:#c62828}
    .controls button.btnSet{background:#1976d2;width:72px;height:44px;border-radius:8px;font-size:1rem}
    .controls button:active{transform:translateY(1px)}
    #items{margin-top:12px}
    #queued{background:#fff8e1;border:1px solid #ffe082;padding:.5rem;margin-top:1rem;border-radius:6px}
    #syncBtn{background:#1976d2;color:#fff;padding:8px 12px;border-radius:8px;border:0;font-weight:600;margin-right:8px}
    #syncBtn.loading{position:relative}
    #syncBtn.loading::after{content:"";width:16px;height:16px;border:2px solid rgba(255,255,255,0.6);border-top-color:transparent;border-radius:50%;position:absolute;right:10px;top:50%;transform:translateY(-50%);animation:spin 1s linear infinite}

    @keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

    @media (prefers-color-scheme:dark){:root{--bg:#050505;--fg:#eee;--high-contrast-bg:#fff;--high-contrast-fg:#000} .item{background:#0b0b0b;border-color:#222} .meta{color:#ccc} .controls button.btnPlus{background:#66bb6a} .controls button.btnMinus{background:#ef5350} .meta .delta{color:rgba(255,255,255,0.5)}}
  </style>
</head>
<body>
  <h1>InvApp</h1>
  <div>
    <button id="syncBtn">Sync Now</button>
    <span id="status">Status: unknown</span>
  </div>

  <h2>Items</h2>
  <div id="items"></div>

  <h3>Queued Events (offline)</h3>
  <div id="queued"></div>

  <template id="itemTpl">
    <div class="item">
      <div>
        <div class="label"></div>
        <div class="meta"></div>
      </div>
      <div class="controls">
        <button class="btnPlus">+</button>
        <button class="btnMinus">-</button>
        <button class="btnSet">Set</button>
      </div>
    </div>
  </template>

  <script src="/idb.js"></script>
  <script src="/app.js"></script>
</body>
</html>
