<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InvApp — Sign In</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="InvApp" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .loginWrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .loginCard { width: 100%; max-width: 360px; padding: 24px; }
    .loginLogo { width: 160px; height: auto; display: block; margin: 0 auto 16px; }
    .loginError { color: var(--danger); font-size: .84rem; min-height: 1.2em; margin-top: 8px; }
  </style>
  <script>
    try {
      const t = localStorage.getItem('invapp.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
</head>
<body>
  <div class="loginWrap">
    <section class="panel loginCard">
      <img class="loginLogo" src="/PeakLogo.svg" alt="Peak Corrosion" />
      <p class="section-title" style="margin-bottom:4px">Sign in</p>
      <p style="margin:0 0 16px;font-size:.84rem;color:var(--fg-muted)">Enter your email to continue. Ask an admin to add you if you don't have access yet.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@peakcorrosion.com" />
      </div>
      <div style="margin-top:14px">
        <button id="loginBtn" class="btn btnPrimary" style="width:100%" type="button">Sign In</button>
      </div>
      <div id="error" class="loginError"></div>
    </section>
  </div>
  <script src="/login.js"></script>
</body>
</html>
